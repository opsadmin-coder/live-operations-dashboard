<!DOCTYPE html>
<html>
<head>
    <title>Maintanance Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px;
            background: #f5f5f5;
        }

        h1 {
            text-align: center;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 1000px;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .number {
            font-size: 40px;
            font-weight: bold;
        }

        .green {
            color: green;
        }

        .yellow {
            color: orange;
        }

        .red {
            color: red;
        }
    </style>
</head>

<body>

    <h1>Live Operations Dashboard</h1>

    <div class="dashboard">

        <div class="card">
            <h2>Total Outlets</h2>
            <div class="number">20</div>
        </div>

        <div class="card">
            <h2>Good</h2>
            <div class="number green">15</div>
        </div>

        <div class="card">
            <h2>With Issues</h2>
            <div class="number yellow">3</div>
        </div>

        <div class="card">
            <h2>Critical</h2>
            <div class="number red">2</div>
        </div>

        <div class="card">
            <h2>Open Maintenance</h2>
            <div class="number red">2</div>
        </div>

        <div class="card">
            <h2>Pending</h2>
            <div class="number yellow">4</div>
        </div>

    </div>

</body>
</html>
